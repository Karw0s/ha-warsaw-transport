openapi: 3.0.3

info:
  title: Warsaw Open Data — ZTM public transport API
  version: "1.0.0"
  description: |
    The public-transport (ZTM / Warszawski Transport Publiczny) endpoints of the Warsaw open data
    portal, as used by this add-on.

    Catalogue: https://dane.um.warszawa.pl/pl/catalogue — API key: https://dane.um.warszawa.pl/pl/key-api

    `https://api.um.warszawa.pl/api/` is **deprecated**; everything here targets
    `https://dane.um.warszawa.pl/api/`. Endpoints are addressed by *name* (`get_ztm_...`), not by
    dataset UUID plus a generic `dbtimetable_get` / `busestrams_get` action as on the old host.

    ## Conventions

    - **Every** endpoint is called with `POST`, even the one that takes no parameters.
    - Parameters go in a JSON request body (`Content-Type: application/json`).
    - Auth is the `Authorization: <JWT>` request header — **no `Bearer` prefix**. A missing or
      invalid key gives HTTP 401.
    - Success is HTTP 200 with a **bare JSON array**; there is no `{"result": ...}` envelope.

    ## Error handling

    Treat "the response body is a JSON array" as the success signal. An error can arrive with
    HTTP 200 as an object carrying an `error` key, or as a bare string (rate limit, bad parameter),
    so the HTTP status alone is not enough. See the `ApiError` schema.

    ## Row encodings

    Responses come back in three different shapes, so a client needs a flattener that handles all
    three:

    | Endpoint | Row shape |
    |---|---|
    | `get_ztm_przystanki_komunikacji_miejskiej`, `get_ztm_lista_linii_na_przystanku` | `{"values": [{"key": k, "value": v}, ...]}` |
    | `get_ztm_odjazdy_linii_z_przystanku` | bare list `[{"key": k, "value": v}, ...]` — no `values` wrapper |
    | `get_ztm_lokalizacja_pojazdow` | plain object, already flat |

    All scalar values in the pair-encoded endpoints are **strings or `null`** — including
    coordinates and IDs. Only `get_ztm_lokalizacja_pojazdow` returns real JSON numbers
    (for `Lat` / `Lon`).

    Ready-to-run requests live in `dane-um-warszawa-requests.http` at the repo root.
