<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warsaw Public Transport</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚌 Warsaw Public Transport</h1>
    <div id="status" class="status"></div>
  </header>

  <main>
    <section class="card">
      <h2>Add a stop</h2>
      <form id="search-form" class="search-row">
        <input id="search-input" type="text" placeholder="Search stop name, e.g. Metro Politechnika" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div id="search-results" class="results"></div>
    </section>

    <section class="card">
      <h2>Your stops</h2>
      <div id="saved-stops" class="saved"></div>
    </section>

    <section class="card">
      <h2>Dashboard card</h2>
      <div id="card-status" class="empty">Checking…</div>
      <div id="card-details" class="card-details" hidden>
        <label for="card-url">Resource URL</label>
        <div class="search-row">
          <input id="card-url" type="text" readonly />
          <button id="card-copy" type="button" class="secondary">Copy</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
