name: Warsaw Public Transport
version: "0.3.1"
slug: warsaw_transport
description: Live Warsaw bus/tram departures on your dashboard via MQTT Discovery.
url: https://github.com/Karw0s/ha-warsaw-transport/tree/main/warsaw_transport
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:bus
panel_title: Warsaw Transport
hassio_api: true
services:
  - mqtt:want
# Needed to install the Lovelace card into <config>/www/warsaw_transport/.
map:
  - homeassistant_config:rw
options:
  api_key: ""
  poll_interval: 30
  gps_overlay: true
  log_level: info
schema:
  api_key: password
  poll_interval: int(10,)
  gps_overlay: bool
  log_level: list(debug|info|warning|error)
